# <---- Warning ---->
# The format of this file is documented in README.md, in the same folder as this
# file. It describes every field, its default, how the SDC processing pipeline
# uses it, and what happens when a major_version changes. Before opening a pull
# request, check your change by running this from the root of your checkout:
#   python -m imap_data_access.dependencies.validation

# ======= Common dependencies =============
spice_basics: &spice_basics
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

# ====== IDEX dependencies =============

(l1a, all):
  partition: 10d
  inputs:
    - *spice_basics
    - source: idex
      data_type: l0
      descriptor: raw
  outputs:
    - source: idex
      data_type: l1a
      descriptor: sci-10days
      major_version: 2
    - source: idex
      data_type: l1a
      descriptor: catlst-10days
      major_version: 1
    - source: idex
      data_type: l1b
      descriptor: catlst-10days
      major_version: 1
    - source: idex
      data_type: l1a
      descriptor: msg-10days
      major_version: 2

(l1b, msg-10days):
  partition: 10d
  inputs:
    - source: idex
      data_type: l1a
      descriptor: msg-10days
  outputs:
    - source: idex
      data_type: l1b
      descriptor: msg-10days
      major_version: 2

(l1b, sci-10days):
  partition: 10d
  inputs:
    - *spice_basics
    - source: idex
      data_type: l1a
      descriptor: sci-10days
    - source: spin
      data_type: spin
      descriptor: historical
    - source: ephemeris_reconstructed
      data_type: spice
      descriptor: historical
    - source: ephemeris_predicted
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: attitude_history
      data_type: spice
      descriptor: historical
    - source: planetary_ephemeris
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: idex
      data_type: l1b
      descriptor: sci-10days
      major_version: 3

(l2a, sci-10days):
  partition: 10d
  inputs:
    - source: idex
      data_type: l1b
      descriptor: sci-10days
    - source: idex
      data_type: ancillary
      descriptor: l2a-calibration-curve-yield-params
    - source: idex
      data_type: ancillary
      descriptor: l2a-calibration-curve-t-rise
  outputs:
    - source: idex
      data_type: l2a
      descriptor: sci-10days
      major_version: 3

(l2b, all-10days):
  partition: 10d
  inputs:
    - *spice_basics
    - source: idex
      data_type: l2a
      descriptor: sci-10days
    - source: idex
      data_type: l1b
      descriptor: msg-10days
  outputs:
    - source: idex
      data_type: l2b
      descriptor: sci-10days
      major_version: 3
    - source: idex
      data_type: l2c
      descriptor: rectangular-map-10days
      major_version: 2

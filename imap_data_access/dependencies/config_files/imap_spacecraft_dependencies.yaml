# <---- Warning ---->
# The format of this file is documented in README.md, in the same folder as this
# file. It describes every field, its default, how the SDC processing pipeline
# uses it, and what happens when a major_version changes. Before opening a pull
# request, check your change by running this from the root of your checkout:
#   python -m imap_data_access.dependencies.validation

(l1a, pointing-attitude):
  partition: pointing_attitude
  inputs:
    - source: repoint
      data_type: repoint
      descriptor: historical
    - source: attitude_history
      data_type: spice
      descriptor: historical
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: imap_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: science_frames
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: spacecraft
      data_type: l1a
      descriptor: pointing-attitude
      major_version: 2


(l1a, quaternions):
  partition: daily
  inputs:
    - source: spacecraft
      data_type: l0
      descriptor: raw
    - source: leapseconds
      data_type: spice
      descriptor: historical
      trigger_job: false
    - source: spacecraft_clock
      data_type: spice
      descriptor: historical
      trigger_job: false
  outputs:
    - source: spacecraft
      data_type: l1a
      descriptor: quaternions
      major_version: 1

# <---- Warning ---->
# The format of this file is documented in README.md, in the same folder as this
# file. It describes every field, its default, how the SDC processing pipeline
# uses it, and what happens when a major_version changes. Before opening a pull
# request, check your change by running this from the root of your checkout:
#   python -m imap_data_access.dependencies.validation

# ====== Common dependencies =============
spice_basics: &spice_basics
  - source: leapseconds
    data_type: spice
    descriptor: historical
    trigger_job: false
  - source: spacecraft_clock
    data_type: spice
    descriptor: historical
    trigger_job: false

l0_data: &l0_data
  - source: hit
    data_type: l0
    descriptor: raw

(l1a, all):
  partition: daily
  inputs:
    - *spice_basics
    - *l0_data
  outputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
      major_version: 1
    - source: hit
      data_type: l1a
      descriptor: counts-sectored
      major_version: 1
    - source: hit
      data_type: l1a
      descriptor: direct-events
      major_version: 1
    - source: hit
      data_type: l1a
      descriptor: hk
      major_version: 1

(l1b, hk):
  partition: daily
  inputs:
    - *spice_basics
    - *l0_data
  outputs:
    - source: hit
      data_type: l1b
      descriptor: hk
      major_version: 1


(l1b, sectored-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-sectored
  outputs:
    - source: hit
      data_type: l1b
      descriptor: sectored-rates
      major_version: 1

(l1b, standard-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
  outputs:
    - source: hit
      data_type: l1b
      descriptor: standard-rates
      major_version: 1

(l1b, summed-rates):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: counts-standard
  outputs:
    - source: hit
      data_type: l1b
      descriptor: summed-rates
      major_version: 1

(l2, macropixel-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: sectored-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-macropixel-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: macropixel-intensity
      major_version: 1

(l2, standard-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: standard-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-standard-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: standard-intensity
      major_version: 1

(l2, summed-intensity):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: summed-rates
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt0-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt1-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt2-factors
    - source: hit
      data_type: ancillary
      descriptor: l1b-to-l2-summed-dt3-factors
  outputs:
    - source: hit
      data_type: l2
      descriptor: summed-intensity
      major_version: 1

(l3, direct-events):
  partition: daily
  inputs:
    - source: hit
      data_type: l1a
      descriptor: direct-events
    - source: hit
      data_type: ancillary
      descriptor: range-2A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4A-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4B-cosine-lookup
    - source: hit
      data_type: ancillary
      descriptor: lo-gain-lookup
    - source: hit
      data_type: ancillary
      descriptor: hi-gain-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4A-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-2B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-3B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: range-4B-charge-fit-lookup
    - source: hit
      data_type: ancillary
      descriptor: hit-event-type-lookup
    - source: hit
      data_type: ancillary
      descriptor: wincorr
  outputs:
    - source: hit
      data_type: l3
      descriptor: direct-events
      major_version: 2

(l3, macropixel):
  partition: daily
  inputs:
    - source: hit
      data_type: l2
      descriptor: macropixel-intensity
    - source: mag
      data_type: l1d
      descriptor: norm-dsrf
    - source: mag
      data_type: l2
      descriptor: norm-dsrf
      required: false
  outputs:
    - source: hit
      data_type: l3
      descriptor: macropixel
      major_version: 1

(l3, electron):
  partition: daily
  inputs:
    - source: hit
      data_type: l1b
      descriptor: standard-rates
    - source: hit
      data_type: ancillary
      descriptor: electron-intensity-factors
  outputs:
    - source: hit
      data_type: l3
      descriptor: electron
      major_version: 1
